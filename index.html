
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ohm's Law Calculator</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Ohm's Law Calculator</h1>
    <p>Calculate voltage, current, or resistance.</p>

    <form id="calculator">
      <fieldset>
        <legend>What do you want to calculate?</legend>

        <label>
          <input type="radio" name="unknown" value="V" checked>
          Voltage (V)
        </label>

        <label>
          <input type="radio" name="unknown" value="I">
          Current (I)
        </label>

        <label>
          <input type="radio" name="unknown" value="R">
          Resistance (R)
        </label>
      </fieldset>

      <label for="voltage">Voltage (V)</label>
      <input id="voltage" type="number" step="any">

      <label for="current">Current (A)</label>
      <input id="current" type="number" step="any">

      <label for="resistance">Resistance (Ω)</label>
      <input id="resistance" type="number" step="any">

      <button type="submit">Calculate</button>
      <button type="reset" onclick="resetCalculator()">
        Reset
      </button>
    </form>

    <p id="result" role="status">
      Your result will appear here.
    </p>
  </main>
</body>
</html>
