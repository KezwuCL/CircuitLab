
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ohm's Law Calculator</title>

  <!-- Connect CSS -->
  <link rel="stylesheet" href="./style.css">

  <!-- Connect JavaScript -->
  <script src="./script.js" defer></script>
</head>

<body>
  <main>
    <h1>Ohm's Law Calculator</h1>

    <p>
      Calculate voltage, current, or resistance
      using Ohm's Law.
    </p>

    <form id="calculator">

      <fieldset>
        <legend>What do you want to calculate?</legend>

        <label>
          <input
            type="radio"
            name="unknown"
            value="V"
            checked
          >
          Voltage (V)
        </label>

        <label>
          <input
            type="radio"
            name="unknown"
            value="I"
          >
          Current (I)
        </label>

        <label>
          <input
            type="radio"
            name="unknown"
            value="R"
          >
          Resistance (R)
        </label>
      </fieldset>

      <!-- Voltage -->
      <label for="voltage">Voltage (V)</label>
      <input
        id="voltage"
        name="voltage"
        type="number"
        step="any"
        placeholder="Enter voltage"
      >

      <!-- Current -->
      <label for="current">Current (A)</label>
      <input
        id="current"
        name="current"
        type="number"
        step="any"
        placeholder="Enter current"
      >

      <!-- Resistance -->
      <label for="resistance">Resistance (Ω)</label>
      <input
        id="resistance"
        name="resistance"
        type="number"
        step="any"
        placeholder="Enter resistance"
      >

      <!-- Buttons -->
      <div class="buttons">
        <button type="submit">
          Calculate
        </button>

        <button type="reset">
          Reset
        </button>
      </div>

    </form>

    <!-- Calculation result -->
    <section aria-label="Calculation results">
  <h2>Calculation Process</h2>
  <div id="process" aria-live="polite">
    Enter two values to see the steps.
  </div>

  <h2>Final Answer</h2>
  <p id="result" role="status" aria-live="polite">
    Your answer will appear here.
  </p>
</section>

  </main>
</body>
</html>
